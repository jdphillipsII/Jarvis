title: CO2 at 80 bar
question: >-
  Why peak specific heat is not a design number. The vessel's cross-sectional
  area at height T is cp(T), so pouring energy in raises a level that is
  temperature, and the volume up to any level is the enthalpy. The peak is a
  bulge you cannot stay inside: absorbing heat is what moves you out of it.
