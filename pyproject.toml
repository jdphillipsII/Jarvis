[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first intelligence layer for Fedora KDE"
requires-python = ">=3.11,<3.13"     # 3.13+ lacks wheels for the audio stack
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
voice  = ["openwakeword", "faster-whisper", "piper-tts", "sounddevice"]
vision = ["opencv-python", "mediapipe"]
fluids = ["CoolProp>=6.4"]
dev    = ["pytest>=8.0"]

[project.scripts]
jarvis = "cli:main"

[tool.setuptools]
packages = ["core", "daemon", "daemon.toolbox", "vision", "voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
