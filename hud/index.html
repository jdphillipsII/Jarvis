<title>JARVIS Command Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Single committed visual world: this is an always-on operational surface
     in a dark room, not a document. Every colour is painted explicitly. */
  :root{
    --ground:#09090b; --raised:#121214; --line:#1f1f23;
    --ink:#fafafa; --ink-2:#a1a1aa; --ink-3:#52525b;
    --cyan:#00e5ff; --amber:#ffb000; --red:#dc2626;
    --accent:var(--cyan);
    --sans:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --display:'Fraunces',Georgia,serif;
  }
  [data-state="elevated"]{ --accent:var(--amber); --ground:#121214; }
  [data-state="critical"]{ --accent:var(--red); }
  [data-state="focused"] { --accent:#3f6f7a; }

  *{box-sizing:border-box;margin:0}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:grid; grid-template-rows:auto 1fr auto;
    transition:background .8s ease;
  }
  .masthead{
    display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
    padding:1.25rem 1.5rem 1rem; border-bottom:1px solid var(--line);
  }
  .wordmark{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em}
  .state{
    font-family:var(--mono);font-size:.7rem;text-transform:uppercase;
    letter-spacing:.18em;color:var(--accent);
  }
  .masthead .spacer{margin-left:auto}
  .chips{display:flex;gap:.5rem;font-family:var(--mono);font-size:.65rem;
         letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .chip{border:1px solid var(--line);padding:.25rem .5rem}
  .chip[data-on="true"]{color:var(--accent);border-color:var(--accent)}

  main{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:2rem;
       padding:1.75rem 1.5rem;align-items:start}
  @media(max-width:640px){ main{grid-template-columns:1fr} .rail{justify-self:center} }

  .rail{display:flex;flex-direction:column;align-items:center;gap:.75rem}
  canvas{width:180px;height:180px;display:block}
  .rail-label{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;
              text-transform:uppercase;color:var(--ink-3);text-align:center}

  /* Bands, not cards: a rule, a monospace label, then the content. */
  .band + .band{margin-top:1.75rem}
  .band-head{display:flex;align-items:center;gap:.75rem;
             border-top:1px solid var(--line);padding-top:.5rem;margin-bottom:.75rem}
  .band-label{font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;
              text-transform:uppercase;color:var(--ink-3)}
  .count{font-family:var(--mono);font-size:.65rem;color:var(--ink-3);margin-left:auto;
         font-variant-numeric:tabular-nums}

  .offer{display:grid;gap:.6rem;padding:.9rem 0 .9rem 1rem;
         border-left:2px solid var(--accent);background:var(--raised)}
  .offer + .offer{margin-top:.6rem}
  .offer[data-urgency="critical"]{border-left-color:var(--red)}
  .offer[data-urgency="warn"]{border-left-color:var(--amber)}
  .offer p{font-size:1rem;line-height:1.5;max-width:62ch;text-wrap:pretty}
  .why{font-family:var(--mono);font-size:.65rem;color:var(--ink-3);letter-spacing:.06em}
  .actions{display:flex;gap:.5rem}
  button{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
    padding:.45rem .9rem;border:1px solid var(--ink-3);background:transparent;
    color:var(--ink-2);cursor:pointer;transition:border-color .15s,color .15s;
  }
  button:hover,button:focus-visible{border-color:var(--accent);color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{border-color:var(--accent);color:var(--accent)}

  .feed{display:grid;gap:.4rem}
  .row{display:grid;grid-template-columns:auto auto 1fr;gap:.75rem;align-items:baseline;
       font-size:.85rem;color:var(--ink-2);padding:.15rem 0}
  .row time,.row .cat{font-family:var(--mono);font-size:.65rem;color:var(--ink-3);
       font-variant-numeric:tabular-nums;letter-spacing:.05em}
  .row .cat{text-transform:uppercase}
  .row[data-urgency="warn"] .cat{color:var(--amber)}
  .row[data-urgency="critical"] .cat{color:var(--red)}
  .empty{font-size:.85rem;color:var(--ink-3);font-style:italic}

  footer{
    display:flex;gap:1.75rem;flex-wrap:wrap;padding:.85rem 1.5rem;
    border-top:1px solid var(--line);font-family:var(--mono);font-size:.7rem;
    color:var(--ink-3);letter-spacing:.06em;font-variant-numeric:tabular-nums;
  }
  footer b{color:var(--ink-2);font-weight:500}
  .demo{color:var(--amber);margin-left:auto}
</style>

<header class="masthead">
  <span class="wordmark">JARVIS</span>
  <span class="state" id="stateLabel">calm</span>
  <span class="spacer"></span>
  <div class="chips">
    <span class="chip" id="chipPresent">present</span>
    <span class="chip" id="chipListen">listening</span>
    <span class="chip" id="chipHeld">held 0</span>
  </div>
</header>

<main>
  <div class="rail">
    <canvas id="reactor" width="360" height="360" aria-hidden="true"></canvas>
    <span class="rail-label" id="railLabel">standing by</span>
  </div>

  <div>
    <section class="band">
      <div class="band-head">
        <span class="band-label">Awaiting your word</span>
        <span class="count" id="offerCount">0</span>
      </div>
      <div id="offers"><p class="empty">Nothing pending, sir.</p></div>
    </section>

    <section class="band">
      <div class="band-head">
        <span class="band-label">Activity</span>
        <span class="count" id="feedCount">0</span>
      </div>
      <div class="feed" id="feed"><p class="empty">Quiet.</p></div>
    </section>
  </div>
</main>

<footer id="telemetry"><span class="demo" id="mode"></span></footer>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const ACCENT = { calm:"#00e5ff", elevated:"#ffb000", critical:"#dc2626", focused:"#3f6f7a" };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let state = { state:"calm", offers:[], feed:[], telemetry:{}, present:true,
                listening:false, held:0 };

  // ---- the ring: state is legible from across the room, before any text ----
  const cv = $("reactor"), ctx = cv.getContext("2d");
  const arc = (r, from, to, w, colour, alpha) => {
    ctx.beginPath(); ctx.strokeStyle = colour; ctx.globalAlpha = alpha;
    ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.arc(180, 180, r, from, to); ctx.stroke(); ctx.globalAlpha = 1;
  };
  function draw(t) {
    const colour = ACCENT[state.state] || ACCENT.calm;
    // Breath rate encodes urgency: calm is a slow tide, critical is a pulse.
    const rate = { calm:.55, focused:.35, elevated:1.1, critical:2.4 }[state.state] || .55;
    const breath = still ? .5 : (Math.sin(t / 1000 * rate) + 1) / 2;
    const spin = still ? 0 : t / 1000 * (state.state === "critical" ? .9 : .18);

    ctx.clearRect(0, 0, 360, 360);
    arc(150, 0, Math.PI * 2, 1, colour, .10);                       // outer trace
    for (let i = 0; i < 3; i++) {                                    // rotating segments
      const a = spin + i * Math.PI * 2 / 3;
      arc(150, a, a + Math.PI / 3.4, 2, colour, .30 + breath * .35);
    }
    arc(122, 0, Math.PI * 2, 1, colour, .12);
    arc(122, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, state.offers.length / 3),
        3, colour, .75);                                             // pending load
    arc(96, 0, Math.PI * 2, 10, colour, .06 + breath * .10);          // core glow
    arc(74, 0, Math.PI * 2, 2, colour, .35 + breath * .45);
    ctx.beginPath(); ctx.fillStyle = colour; ctx.globalAlpha = .12 + breath * .18;
    ctx.arc(180, 180, 62, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---- render ----
  const clock = ts => new Date((ts || Date.now() / 1000) * 1000)
    .toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });

  function render() {
    document.documentElement.setAttribute("data-state", state.state);
    $("stateLabel").textContent = state.state;
    $("chipPresent").dataset.on = state.present;
    $("chipListen").dataset.on = state.listening;
    $("chipHeld").textContent = `held ${state.held}`;
    $("chipHeld").dataset.on = state.held > 0;
    $("railLabel").textContent = state.offers.length
      ? `${state.offers.length} awaiting` : "standing by";

    $("offerCount").textContent = state.offers.length;
    $("offers").innerHTML = state.offers.length ? "" :
      '<p class="empty">Nothing pending, sir.</p>';
    state.offers.forEach(o => {
      const el = document.createElement("article");
      el.className = "offer"; el.dataset.urgency = o.urgency;
      const p = document.createElement("p"); p.textContent = o.text;
      const why = document.createElement("span");
      why.className = "why"; why.textContent = `${o.category} · ${o.reason}`;
      const actions = document.createElement("div"); actions.className = "actions";
      const yes = document.createElement("button");
      yes.className = "primary"; yes.textContent = "Confirm";
      yes.onclick = () => answer(o.id, "confirm");
      const no = document.createElement("button");
      no.textContent = "Dismiss"; no.onclick = () => answer(o.id, "decline");
      actions.append(yes, no); el.append(p, why, actions);
      $("offers").append(el);
    });

    $("feedCount").textContent = state.feed.length;
    $("feed").innerHTML = state.feed.length ? "" : '<p class="empty">Quiet.</p>';
    state.feed.forEach(c => {
      const row = document.createElement("div");
      row.className = "row"; row.dataset.urgency = c.urgency;
      row.innerHTML = `<time>${clock(c.ts)}</time><span class="cat"></span><span></span>`;
      row.querySelector(".cat").textContent = c.category;
      row.lastElementChild.textContent = c.text;
      $("feed").append(row);
    });

    const t = state.telemetry || {};
    const bits = [];
    if (t.gpu_temp_c   != null) bits.push(`GPU <b>${t.gpu_temp_c}°C</b>`);
    if (t.vram_pct     != null) bits.push(`VRAM <b>${t.vram_pct}%</b>`);
    if (t.disk_free_gb != null) bits.push(`DISK <b>${t.disk_free_gb} GB free</b>`);
    if (t.load_1m      != null) bits.push(`LOAD <b>${t.load_1m}</b>`);
    const mode = $("mode").textContent;
    $("telemetry").innerHTML = bits.join("") || "";
    $("telemetry").querySelectorAll("span").forEach(n => n.remove());
    bits.forEach(b => { const s = document.createElement("span");
                        s.innerHTML = b; $("telemetry").append(s); });
    const m = document.createElement("span");
    m.className = "demo"; m.id = "mode"; m.textContent = mode;
    $("telemetry").append(m);
  }

  async function answer(id, verb) {
    state.offers = state.offers.filter(o => o.id !== id);
    render();
    try {
      await fetch("/answer", { method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ id, answer: verb }) });
    } catch { /* demo mode: nothing to talk to */ }
  }

  // ---- live if the daemon is there; otherwise demonstrate itself ----
  let live = false;
  try {
    const es = new EventSource("/events");
    es.onmessage = e => { live = true; state = JSON.parse(e.data); render(); };
    es.onerror = () => { if (!live) { es.close(); demo(); } };
    setTimeout(() => { if (!live) { es.close(); demo(); } }, 1200);
  } catch { demo(); }

  function demo() {
    $("mode").textContent = "demo — no daemon attached";
    const now = () => Date.now() / 1000;
    const script = [
      { at:600,  fn:s => { s.telemetry={gpu_temp_c:61,vram_pct:38,disk_free_gb:412,load_1m:0.7};
                           s.feed.unshift({id:"b1",text:"Ingest finished — 1,204 documents.",
                             urgency:"info",category:"ci",ts:now()}); } },
      { at:2600, fn:s => { s.state="elevated";
                           s.offers.push({id:"o1",text:"GPU's running warm, sir — 87 degrees.",
                             urgency:"warn",category:"gpu",reason:"attention available"}); } },
      { at:6200, fn:s => { s.telemetry.gpu_temp_c=91; s.listening=true;
                           s.feed.unshift({id:"b2",text:"Fan curve stepped to 78%.",
                             urgency:"info",category:"gpu",ts:now()}); } },
      { at:9000, fn:s => { s.state="critical"; s.telemetry.gpu_temp_c=96; s.listening=false;
                           s.offers.push({id:"o2",text:"Thermal limit reached. Shall I throttle the render, sir?",
                             urgency:"critical",category:"gpu",reason:"critical overrides focus"}); } },
      { at:15000,fn:s => { s.state="focused"; s.offers.length=0; s.held=3;
                           s.telemetry.gpu_temp_c=64;
                           s.feed.unshift({id:"b3",text:"Three items held while you work.",
                             urgency:"info",category:"policy",ts:now()}); } },
      { at:20000,fn:s => { s.state="calm"; s.held=0;
                           s.feed.unshift({id:"b4",text:"All nominal.",urgency:"info",
                             category:"system",ts:now()}); } },
    ];
    const start = performance.now();
    const run = () => {
      const t = performance.now() - start;
      script.forEach(step => { if (!step.done && t >= step.at) {
        step.done = true; step.fn(state); render(); } });
      if (t > 24000) { script.forEach(s => s.done = false);
                       Object.assign(state,{state:"calm",offers:[],feed:[],held:0});
                       return setTimeout(demo, 400); }
      setTimeout(run, 200);
    };
    render(); run();
  }
  render();
})();
</script>
